p và</tspan><tspan x="20" y="201">tính calo mỗi ngày. Đổi lại lúc nào cũng</tspan><tspan x="20" y="221">được.</tspan></text></g><g id="setup_col_2"><g id="setup_opt"><rect x="20" y="243" width="350" height="87.17" rx="22" fill="#17191C"/><rect x="21" y="244" width="348" height="85.17" rx="21" fill="none" stroke="#EFF0EC" stroke-width="2"/><rect x="34" y="266.58" width="7" height="40" rx="2.5" fill="#E4473A"/><g id="setup_grow_2"><text xml:space="preserve" font-family="Be Vietnam Pro" font-size="16" font-weight="700" letter-spacing="-0.16" fill="#EFF0EC"><tspan x="55" y="273">Giảm cân</tspan></text><text xml:space="preserve" font-family="Be Vietnam Pro" font-size="13" font-weight="400" fill="#A4A9A2"><tspan x="55" y="293.8">Đốt mỡ, giữ cơ. Ăn thiếu khoảng 400 kcal</tspan><tspan x="55" y="311.98">mỗi ngày.</tspan></text></g><g id="setup_radio"><rect x="332" y="274.58" width="24" height="24" rx="12" fill="#EFF0EC"/><g transform="translate(337 279.58) scale(0.58)"><path d="M20 6 9 17l-5-5" fill="none" stroke="#0D0E10" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill-opacity="1" stroke-opacity="1"></path></g></g></g><g id="setup_opt_2"><rect x="20" y="340.17" width="350" height="68.98" rx="22" fill="#17191C"/><rect x="34" y="354.66" width="7" height="40" rx="2.5" fill="#2C6BEF"/><g id="setup_grow_3"><text xml:space="preserve" font-family="Be Vietnam Pro" font-size="16" font-weight="700" letter-spacing="-0.16" fill="#EFF0EC"><tspan x="55" y="370.17">Tăng cơ</tspan></text><text xml:space="preserve" font-family="Be Vietnam Pro" font-size="13" font-weight="400" fill="#A4A9A2"><tspan x="55" y="390.97">Tập nặng dần mỗi tuần, ăn đủ đạm.</tspan></text></g><rect x="333" y="363.66" width="22" height="22" rx="11" fill="none" stroke="#2A2E33" stroke-width="2"/></g><g id="setup_opt_3"><rect x="20" y="419.16" width="350" height="87.17" rx="22" fill="#17191C"/><rect x="34" y="442.73" width="7" height="40" rx="2.5" fill="#F1B11A"/><g id="setup_grow_4"><text xml:space