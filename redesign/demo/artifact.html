<title>FitCoach Redesign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Bố cục: khung demo (danh sách màn · điện thoại · ghi chú). Ứng dụng: nền phấn, thẻ trắng, thẻ chính màu cao su đen.
   Màu đĩa tạ thi đấu (đỏ, xanh dương, vàng, xanh lá) mã hoá mọi chỉ số và nhóm cơ. */
:root {
  --bg: #ECEEE9;
  --surface: #FFFFFF;
  --surface-2: #F3F4F0;
  --ink: #14161A;
  --ink-2: #585D57;
  --ink-3: #8A8F89;
  --line: #DDE0D9;
  --hero: #14161A;
  --hero-2: #26292E;
  --on-hero: #F2F3EF;
  --on-hero-2: #9DA29B;
  --cta: #14161A;
  --on-cta: #FFFFFF;
  --red: #E4473A;
  --blue: #2C6BEF;
  --blue-2: #93B3F8;
  --yellow: #F1B11A;
  --green: #11A068;
  --red-soft: #FBE2DE;
  --blue-soft: #E0E9FD;
  --yellow-soft: #FCEFD0;
  --green-soft: #D9F1E6;
  --red-ink: #B8291D;
  --blue-ink: #1D4FC0;
  --yellow-ink: #8A5E00;
  --green-ink: #0A7A4F;
  --shell: #D9DCD5;
  --shell-panel: #E8EAE5;
  --shell-ink: #14161A;
  --shell-2: #5E635D;
  --bezel: #0B0C0E;
  --cam: #0C0D0F;
  --cam-2: #1B1E22;
  --cam-3: #2A2E33;
  --cam-ink: #F2F3EF;
  --cam-ink-2: #9DA29B;
  --plate-rim: #FFFFFF;
  --plate-in: #F6F6F2;
  --f-ui: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0E10; --surface: #17191C; --surface-2: #202327; --ink: #EFF0EC; --ink-2: #A4A9A2; --ink-3: #6E736D; --line: #2A2E33;
    --hero: #22262B; --hero-2: #31353B; --cta: #EFF0EC; --on-cta: #14161A;
    --red-soft: #3A1E1B; --blue-soft: #172440; --yellow-soft: #392D12; --green-soft: #0F2F20;
    --red-ink: #FF8C80; --blue-ink: #95B6FF; --yellow-ink: #F6CB5E; --green-ink: #5DD6A0;
    --shell: #060708; --shell-panel: #111316; --shell-ink: #EFF0EC; --shell-2: #8B908A; --bezel: #2A2D31;
    --plate-rim: #2A2E33; --plate-in: #222529;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0E10; --surface: #17191C; --surface-2: #202327; --ink: #EFF0EC; --ink-2: #A4A9A2; --ink-3: #6E736D; --line: #2A2E33;
  --hero: #22262B; --hero-2: #31353B; --cta: #EFF0EC; --on-cta: #14161A;
  --red-soft: #3A1E1B; --blue-soft: #172440; --yellow-soft: #392D12; --green-soft: #0F2F20;
  --red-ink: #FF8C80; --blue-ink: #95B6FF; --yellow-ink: #F6CB5E; --green-ink: #5DD6A0;
  --shell: #060708; --shell-panel: #111316; --shell-ink: #EFF0EC; --shell-2: #8B908A; --bezel: #2A2D31;
  --plate-rim: #2A2E33; --plate-in: #222529;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--shell); color: var(--shell-ink); font-family: var(--f-ui);
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
p, h1, h2, h3, ol, ul { margin: 0; padding: 0; }
ul, ol { list-style: none; }
.ic { flex-shrink: 0; display: block; }

/* ---------- Khung demo ---------- */
.d-shell { display: grid; grid-template-columns: 236px minmax(0, 1fr) 272px; gap: 28px; max-width: 1340px; margin: 0 auto; padding-block: 24px; min-height: 100%; }
.d-side { position: sticky; top: 24px; align-self: start; display: flex; flex-direction: column; gap: 18px; max-height: calc(100vh - 48px); overflow-y: auto; scrollbar-width: thin; }
.d-brand { display: flex; align-items: center; gap: 10px; }
.d-brand b { font: 800 19px/1 var(--f-ui); letter-spacing: -.02em; }
.d-brand small { display: block; font: 600 12px/1.2 var(--f-num); letter-spacing: .1em; text-transform: uppercase; color: var(--shell-2); margin-top: 3px; }
.d-group h3 { font: 600 12px/1 var(--f-num); letter-spacing: .12em; text-transform: uppercase; color: var(--shell-2); margin: 0 0 6px 10px; }
.d-group button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 10px; border-radius: 10px; font-size: 14px; font-weight: 500; }
.d-group button:hover { background: var(--shell-panel); }
.d-group button.on { background: var(--shell-ink); color: var(--shell); }
.d-group button .d-new { margin-left: auto; font: 700 11px/1 var(--f-num); letter-spacing: .08em; text-transform: uppercase; padding: 4px 6px; border-radius: 6px; background: var(--yellow); color: #14161A; }
.d-dot { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
.d-theme { display: flex; padding: 4px; border-radius: 12px; background: var(--shell-panel); gap: 4px; }
.d-theme button { flex: 1; padding: 7px 0; border-radius: 9px; font-size: 13px; font-weight: 600; text-align: center; color: var(--shell-2); }
.d-theme button.on { background: var(--shell-ink); color: var(--shell); }
.d-stage { display: flex; justify-content: center; align-items: flex-start; min-width: 0; }
.d-phone-wrap { position: sticky; top: 24px; }
.d-phone { width: 390px; height: 844px; border-radius: 56px; border: 11px solid var(--bezel); background: var(--bg); position: relative; overflow: hidden; box-shadow: 0 30px 60px -20px rgb(0 0 0 / .35), 0 0 0 1px rgb(0 0 0 / .2); transform-origin: top center; }
.d-phone::after { content: ""; position: absolute; top: 10px; left: 50%; width: 118px; height: 34px; margin-left: -59px; border-radius: 20px; background: #000; z-index: 30; pointer-events: none; }
.d-notes { position: sticky; top: 24px; align-self: start; display: flex; flex-direction: column; gap: 14px; }
.d-notes .d-kicker { font: 600 12px/1 var(--f-num); letter-spacing: .12em; text-transform: uppercase; color: var(--shell-2); }
.d-notes h2 { font: 800 24px/1.15 var(--f-ui); letter-spacing: -.02em; text-wrap: balance; }
.d-notes p { font-size: 14px; line-height: 1.55; color: var(--shell-2); }
.d-notes ul { display: flex; flex-direction: column; gap: 8px; }
.d-notes li { font-size: 14px; line-height: 1.45; padding-left: 16px; position: relative; }
.d-notes li::before { content: ""; position: absolute; left: 0; top: 7px; width: 6px; height: 6px; border-radius: 2px; background: var(--shell-2); }
.d-notes li.new::before { background: var(--yellow); }
.d-card { background: var(--shell-panel); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.d-pager { display: flex; gap: 8px; }
.d-pager button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; border-radius: 12px; background: var(--shell-panel); font-size: 13px; font-weight: 600; }
.d-pager button:hover { background: var(--shell-ink); color: var(--shell); }
.d-mobile-bar { display: none; }
.d-guide { width: 100%; max-width: 1040px; }

/* ---------- Ứng dụng ---------- */
.app { position: absolute; inset: 0; color: var(--ink); font-size: 15px; line-height: 1.45; }
.scr { position: absolute; inset: 0; overflow-y: auto; background: var(--bg); display: flex; flex-direction: column; scrollbar-width: none; }
.scr::-webkit-scrollbar { display: none; }
.scr.cam { background: var(--cam); color: var(--cam-ink); }
.sb { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; height: 54px; padding: 6px 32px 0 40px; background: var(--bg); flex-shrink: 0; font: 600 16px/1 var(--f-ui); letter-spacing: -.01em; }
.sb.clear { background: transparent; position: absolute; left: 0; right: 0; }
.cam .sb { background: var(--cam); color: var(--cam-ink); }
.sb-r { display: flex; gap: 6px; align-items: center; }
.body { flex: 1; padding: 8px 20px 28px; display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.col { display: flex; flex-direction: column; }
.lbl { font: 600 13px/1.1 var(--f-num); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }
.num { font-family: var(--f-num); font-weight: 700; line-height: .9; letter-spacing: -.01em; }
.h1 { font: 800 30px/1.1 var(--f-ui); letter-spacing: -.03em; }
.h2 { font: 700 19px/1.25 var(--f-ui); letter-spacing: -.015em; }
.h3 { font: 700 16px/1.3 var(--f-ui); letter-spacing: -.01em; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; line-height: 1.4; }
.xs { font-size: 12px; line-height: 1.35; }
.card { background: var(--surface); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.card.tight { gap: 10px; }
.card.hero { background: var(--hero); color: var(--on-hero); }
.hero .lbl, .cam .lbl { color: var(--on-hero-2); }
.hero .muted { color: var(--on-hero-2); }
.btn { white-space: nowrap; height: 54px; border-radius: 999px; background: var(--cta); color: var(--on-cta); font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 22px; flex-shrink: 0; }
.btn.sm { height: 44px; font-size: 14px; padding: 0 18px; }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.line { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.light { background: var(--on-hero); color: #14161A; }
.btn.on-dark { background: var(--hero-2); color: var(--on-hero); }
.cam .btn.on-dark { background: var(--cam-3); color: var(--cam-ink); }
.btn.wide { width: 100%; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; position: relative; flex-shrink: 0; }
.icon-btn.flat { background: var(--surface-2); }
.cam .icon-btn, .icon-btn.glass { background: rgb(255 255 255 / .12); color: var(--cam-ink); }
.icon-btn .dot { position: absolute; top: 11px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px var(--surface); }
.avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font: 700 17px/1 var(--f-num); letter-spacing: .02em; background: var(--yellow); color: #14161A; flex-shrink: 0; }
.tag { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.tag.red { background: var(--red-soft); color: var(--red-ink); }
.tag.blue { background: var(--blue-soft); color: var(--blue-ink); }
.tag.yellow { background: var(--yellow-soft); color: var(--yellow-ink); }
.tag.green { background: var(--green-soft); color: var(--green-ink); }
.tag.on-hero { background: var(--hero-2); color: var(--on-hero); }
.link { display: inline-flex; align-items: center; gap: 2px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.hero .link { color: var(--on-hero-2); }
.sec { display: flex; align-items: baseline; justify-content: space-between; margin-top: 8px; }
.seg { display: flex; padding: 4px; border-radius: 999px; background: var(--surface); gap: 2px; }
.seg button { flex: 1; height: 38px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--ink-2); text-align: center; white-space: nowrap; padding: 0 12px; }
.seg button.on { background: var(--cta); color: var(--on-cta); }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar > i { display: block; height: 100%; border-radius: 99px; }
.hero .bar { background: var(--hero-2); }
.divider { height: 1px; background: var(--line); }
.plate { width: 7px; height: 20px; border-radius: 2.5px; flex-shrink: 0; }
.chev { color: var(--ink-3); }
.hscroll { display: flex; gap: 10px; overflow-x: auto; margin: 0 -20px; padding: 0 20px; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }

/* Thanh điều hướng dưới */
.nav { position: sticky; bottom: 0; z-index: 10; margin-top: auto; background: var(--surface); border-top: 1px solid var(--line); padding: 8px 10px 30px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: start; flex-shrink: 0; }
.nav button { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--ink-3); padding-top: 4px; }
.nav button.on { color: var(--ink); }
.nav .fab { width: 56px; height: 56px; border-radius: 50%; background: var(--cta); color: var(--on-cta); display: grid; place-items: center; justify-self: center; margin-top: -24px; padding: 0; box-shadow: 0 0 0 6px var(--surface); }
.home-ind { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); }
.cam .home-ind, .home-ind.light { background: var(--cam-ink); }
.cam .home-ind.dark { background: var(--ink); }
.actionbar { position: sticky; bottom: 0; z-index: 10; margin-top: auto; padding: 12px 20px 34px; background: var(--bg); display: flex; gap: 10px; flex-shrink: 0; }
.cam .actionbar { background: var(--cam); }

/* Trang chủ */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 9px 0 8px; border-radius: 16px; }
.day .wd { font: 600 12px/1 var(--f-num); letter-spacing: .06em; color: var(--ink-3); }
.day .dn { font: 700 18px/1 var(--f-num); }
.day .pip { width: 14px; height: 4px; border-radius: 2px; background: var(--line); }
.day.today { background: var(--cta); color: var(--on-cta); }
.day.today .wd { color: var(--on-cta); opacity: .7; }
.hero-mid { display: flex; align-items: center; gap: 4px; }
.hero-pct { width: 96px; flex-shrink: 0; }
.hero-pct .big { font-size: 68px; }
.hero-pct .pct { font-size: 30px; color: var(--on-hero-2); }
.legend4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.legend4 .lg { display: flex; flex-direction: column; gap: 3px; }
.lg .num { font-size: 24px; }
.lg .of { font-size: 12px; color: var(--on-hero-2); }
.lg .nm { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--on-hero-2); }
.lg .nm i { width: 6px; height: 12px; border-radius: 2px; }
.hint { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 10px 12px; border-radius: 14px; background: var(--hero-2); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 150px; }
.tile .num { font-size: 32px; }
.tile .num small { font-size: 16px; color: var(--ink-2); font-weight: 600; margin-left: 2px; }
.tile-h { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.tile-h .ib { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; }
.glasses { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; margin-top: auto; }
.glasses i { height: 18px; border-radius: 3px 3px 5px 5px; background: var(--surface-2); }
.glasses i.on { background: var(--blue); }
.mini-btn { height: 30px; border-radius: 99px; padding: 0 10px; font-size: 12px; font-weight: 600; background: var(--blue-soft); color: var(--blue-ink); display: inline-flex; align-items: center; gap: 4px; }
.macro { display: grid; grid-template-columns: 74px 1fr 64px; align-items: center; gap: 10px; font-size: 13px; }
.macro b { font-weight: 600; }
.macro span:last-child { text-align: right; color: var(--ink-2); }
.next-meal { display: flex; align-items: center; gap: 12px; }
.tip { background: var(--green-soft); border-radius: 22px; padding: 16px; display: flex; gap: 12px; }
.tip .ib { width: 36px; height: 36px; border-radius: 12px; background: var(--green); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
.mini-plates { display: flex; gap: 4px; align-items: center; }
.mini-plates i { width: 9px; height: 26px; border-radius: 3px; }
.mini-plates i.off { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }

/* Tập luyện */
.wk-days { display: flex; gap: 8px; }
.wk-day { flex: 1; min-width: 0; border-radius: 16px; padding: 10px 0 9px; background: var(--surface); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.wk-day .wd { font: 600 12px/1 var(--f-num); letter-spacing: .06em; color: var(--ink-3); }
.wk-day .dn { font: 700 17px/1 var(--f-num); }
.wk-day .pl { width: 18px; height: 5px; border-radius: 3px; }
.wk-day.rest { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
.wk-day.today { background: var(--cta); color: var(--on-cta); }
.wk-day.today .wd { color: var(--on-cta); opacity: .7; }
.wk-day .ck { width: 16px; height: 16px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.part { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.part .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 700 15px/1 var(--f-num); background: var(--surface); flex-shrink: 0; }
.part .n.done { background: var(--green); color: #fff; }
.phase { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 22px; }
.phase .pi { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; flex-shrink: 0; background: var(--surface); color: var(--ink); }
.phase .pi.done { background: var(--green); color: #fff; }
.ex-list { display: flex; flex-direction: column; gap: 8px; }
.ex { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 22px; padding: 10px 12px 10px 10px; }
.ex-main { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.thumb { width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; flex-shrink: 0; }
.ex-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ex-txt b { font-weight: 600; font-size: 15px; }
.ex.done .ex-txt b { color: var(--ink-3); text-decoration: line-through; }
.ex-amt { font: 700 16px/1.1 var(--f-num); letter-spacing: .01em; }
.ex-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12px; color: var(--ink-2); }
.mtag { display: inline-flex; align-items: center; gap: 4px; }
.mtag i { width: 5px; height: 11px; border-radius: 1.5px; }
.ai { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; color: var(--blue-ink); }
.chk { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 2px var(--line); flex-shrink: 0; color: transparent; }
.ex.done .chk { background: var(--green); box-shadow: none; color: #fff; }

/* Chi tiết bài tập */
.visual { position: relative; border-radius: 28px; height: 300px; display: grid; place-items: center; overflow: hidden; }
.visual .tl { position: absolute; top: 14px; left: 14px; }
.visual .tr { position: absolute; top: 14px; right: 14px; }
.visual .br { position: absolute; bottom: 14px; right: 14px; }
.visual .bl { position: absolute; bottom: 14px; left: 14px; }
.pill { height: 38px; padding: 0 14px; border-radius: 99px; background: var(--surface); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.stat4 { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-radius: 22px; padding: 14px 6px; }
.stat4 > div { text-align: center; display: flex; flex-direction: column; gap: 4px; }
.stat4 > div + div { box-shadow: -1px 0 0 var(--line); }
.stat4 .num { font-size: 28px; }
.stat4 span:last-child { font-size: 12px; color: var(--ink-2); }
.mbar { display: grid; grid-template-columns: 92px 1fr 40px; align-items: center; gap: 10px; font-size: 14px; }
.mbar span:last-child { text-align: right; font: 600 14px/1 var(--f-num); color: var(--ink-2); }
.steps { display: flex; flex-direction: column; gap: 12px; }
.steps li { display: flex; gap: 12px; font-size: 15px; }

// Thanh đòn nhìn ngang: mỗi đĩa là một chỉ số, phần màu đậm dâng lên theo % hoàn thành
let uid = 0;
function barbell(plates, o = {}) {
  const W = o.w ?? 210, H = o.h ?? 130, pw = o.pw ?? 28, gap = o.gap ?? 5, ph = o.ph ?? 118;
  const cy = H / 2, sleeveEnd = 14, n = plates.length;
  const x0 = W - sleeveEnd - n * (pw + gap) + gap;
  const shaft = o.shaft ?? 'var(--on-hero-2)';
  const empty = o.empty ?? 'var(--hero-2)';
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">`;
  s += `<rect x="0" y="${cy - 3.5}" width="${x0 - 12}" height="7" rx="3.5" fill="${shaft}" opacity="0.55"/>`;
  s += `<rect x="${x0 - 16}" y="${cy - 13}" width="10" height="26" rx="3" fill="${shaft}"/>`;
  s += `<rect x="${x0 - 8}" y="${cy - 7}" width="${W - x0 + 8}" height="14" rx="5" fill="${shaft}" opacity="0.8"/>`;
  plates.forEach((p, i) => {
    const x = x0 + i * (pw + gap), y = cy - ph / 2;
    const pct = Math.max(0, Math.min(1, p.pct));
    if (p.outline) {
      s += `<rect x="${x + 1}" y="${y + 1}" width="${pw - 2}" height="${ph - 2}" rx="6" fill="none" stroke="${empty}" stroke-width="2" stroke-dasharray="4 4"/>`;
      return;
    }
    s += `<rect x="${x}" y="${y}" width="${pw}" height="${ph}" rx="6" fill="${C[p.c]}" fill-opacity="0.22"/>`;
    if (pct > 0) {
      const fh = Math.max(12, ph * pct);
      s += `<rect class="${o.anim ? 'anim-plate' : ''}" style="animation-delay:${i * 90}ms" x="${x}" y="${y + ph - fh}" width="${pw}" height="${fh}" rx="6" fill="${C[p.c]}"/>`;
    }
    s += `<rect x="${x + pw / 2 - 1}" y="${y + 10}" width="2" height="${ph - 20}" rx="1" fill="#000" opacity="0.1"/>`;
  });
  return s + '</svg>';
}

// Món ăn nhìn từ trên xuống, vẽ bằng hình khối đơn giản
function rnd(seed) { let s = seed; return () => ((s = (s * 9301 + 49297) % 233280) / 233280); }
function dish(kind, size = 100) {
  const r = rnd(kind.length * 31 + 7);
  let s = `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">`;
  const plate = (inner = '#F6F5F0') => `<circle cx="50" cy="50" r="47" fill="#FFFFFF" stroke="#E2E4DE" stroke-width="1.5"/><circle cx="50" cy="50" r="37" fill="${inner}"/>`;
  const bowl = (broth, rim = '#F3EFE7') => `<circle cx="50" cy="50" r="47" fill="${rim}" stroke="#DCD6CA" stroke-width="1.5"/><circle cx="50" cy="50" r="46" fill="none" stroke="#3E6FB0" stroke-width="1.6" stroke-dasharray="2 3" opacity="0.55"/><circle cx="50" cy="50" r="38" fill="${broth}"/>`;
  const herbs = (n, cx = 50, cy = 50, rad = 30, col = '#3F9D49') => { let h = ''; for (let i = 0; i < n; i++) { const a = r() * 6.28, d = r() * rad; h += `<ellipse cx="${(cx + Math.cos(a) * d).toFixed(1)}" cy="${(cy + Math.sin(a) * d).toFixed(1)}" rx="2.6" ry="1.5" transform="rotate(${(r() * 180).toFixed(0)} ${(cx + Math.cos(a) * d).toFixed(1)} ${(cy + Math.sin(a) * d).toFixed(1)})" fill="${col}"/>`; } return h; };
  if (kind === 'oats') {
    s += bowl('#E8D6B0');
    for (let i = 0; i < 26; i++) s += `<circle cx="${(22 + r() * 56).toFixed(1)}" cy="${(22 + r() * 56).toFixed(1)}" r="${(1 + r() * 1.4).toFixed(1)}" fill="#D3BC8E"/>`;
    [[38, 36], [50, 31], [62, 37]].forEach(([x, y]) => s += `<circle cx="${x}" cy="${y}" r="7" fill="#F7E68C" stroke="#E7C94F" stroke-width="1.2"/><circle cx="${x}" cy="${y}" r="1.4" fill="#D8B54A"/>`);
    s += `<ellipse cx="54" cy="62" rx="13" ry="11" fill="#FFFFFF" stroke="#ECE7DA" stroke-width="1"/><circle cx="55" cy="62" r="6" fill="#F4B638"/>`;
  } else if (kind === 'comga' || kind === 'gaapchao') {
    const brown = kind === 'gaapchao';
    s += plate();
    s += `<circle cx="38" cy="44" r="20" fill="${brown ? '#D9C3A0' : '#FFFFFF'}" stroke="#EAE6DB" stroke-width="1"/>`;
    for (let i = 0; i < 18; i++) s += `<ellipse cx="${(26 + r() * 24).toFixed(1)}" cy="${(32 + r() * 24).toFixed(1)}" rx="1.8" ry="0.9" fill="${brown ? '#B89B70' : '#E9E5DA'}"/>`;
    [[60, 36, 20], [66, 50, -12], [58, 62, 8]].forEach(([x, y, a]) => s += `<rect x="${x - 10}" y="${y - 5}" width="20" height="10" rx="4" transform="rotate(${a} ${x} ${y})" fill="${brown ? '#D99A55' : '#F2D7AE'}" stroke="${brown ? '#B9763A' : '#E2BC86'}" stroke-width="1"/>`);
    [[34, 70], [44, 72], [26, 62]].forEach(([x, y]) => s += `<circle cx="${x}" cy="${y}" r="5.5" fill="#D6EDBE" stroke="#7DB45A" stroke-width="1.3"/>`);
    s += herbs(6, 62, 48, 14);
  } else if (kind === 'milk') {
    s += `<circle cx="50" cy="50" r="40" fill="#E7EEF8" stroke="#D3DCE8" stroke-width="1.5"/><circle cx="50" cy="50" r="32" fill="#FFFFFF"/><circle cx="50" cy="50" r="24" fill="#FAFAF7"/><rect x="58" y="14" width="5" height="40" rx="2.5" transform="rotate(28 60 34)" fill="#2C6BEF"/>`;
  } else if (kind === 'canhchua') {
    s += bowl('#F2B566');
    [[36, 36, 30], [62, 58, -20]].forEach(([x, y, a]) => s += `<rect x="${x - 10}" y="${y - 7}" width="20" height="14" rx="5" transform="rotate(${a} ${x} ${y})" fill="#F7EDDF" stroke="#E3D3BC" stroke-width="1"/>`);
    [[58, 34], [38, 60], [66, 44]].forEach(([x, y], i) => s += `<path d="M${x - 7} ${y} a7 7 0 0 1 14 0 z" transform="rotate(${i * 70} ${x} ${y})" fill="#E5533F"/>`);
    [[48, 48], [30, 48], [52, 68]].forEach(([x, y]) => s += `<rect x="${x - 4}" y="${y - 4}" width="8" height="8" rx="1.5" fill="#F6D45E"/>`);
    for (let i = 0; i < 7; i++) { const x = 26 + r() * 46, y = 26 + r() * 46; s += `<path d="M${x.toFixed(1)} ${y.toFixed(1)} l${(6 + r() * 4).toFixed(1)} ${(r() * 4 - 2).toFixed(1)}" stroke="#FFFBEF" stroke-width="2" stroke-linecap="round"/>`; }
    s += herbs(14);
  } else if (kind === 'salad') {
    s += plate('#F3F5EE');
    for (let i = 0; i < 16; i++) { const a = r() * 6.28, d = r() * 22; s += `<circle cx="${(50 + Math.cos(a) * d).toFixed(1)}" cy="${(50 + Math.sin(a) * d).toFixed(1)}" r="${(7 + r() * 5).toFixed(1)}" fill="${['#7CC36A', '#5BAA4E', '#A6D98A', '#8FCB6E'][i % 4]}"/>`; }
    [[44, 42, 25], [56, 52, -15], [46, 60, 40], [60, 38, 70]].forEach(([x, y, a]) => s += `<rect x="${x - 9}" y="${y - 3.5}" width="18" height="7" rx="3" transform="rotate(${a} ${x} ${y})" fill="#EDC795" stroke="#D4A56A" stroke-width="1"/>`);
    [[32, 46], [66, 62], [52, 30]].forEach(([x, y]) => s += `<circle cx="${x}" cy="${y}" r="5" fill="#E5533F"/><circle cx="${x - 1.5}" cy="${y - 1.5}" r="1.3" fill="#FFFFFF" opacity="0.6"/>`);
    for (let i = 0; i < 18; i++) s += `<ellipse cx="${(32 + r() * 36).toFixed(1)}" cy="${(32 + r() * 36).toFixed(1)}" rx="1" ry="0.6" fill="#FFF7E2"/>`;
  } else if (kind === 'dauhu') {
    s += plate();

    for (let i = 0; i < 9; i++) { const x = 30 + r() * 40, y = 30 + r() * 40; s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.2" fill="none" stroke="#4FA34B" stroke-width="1.4"/>`; }
  } else if (kind === 'pho') {
    s += bowl('#E9C88F', '#FFFFFF');
    for (let i = 0; i < 9; i++) { const y = 30 + i * 4.5; s += `<path d="M${24 + r() * 6} ${y} q13 ${(r() * 8 - 4).toFixed(1)} 26 0 t${(18 + r() * 8).toFixed(1)} 0" fill="none" stroke="#FFF9EC" stroke-width="2.6" stroke-linecap="round"/>`; }
    [[40, 40, 20], [58, 44, -25], [50, 58, 10]].forEach(([x, y, a]) => s += `<ellipse cx="${x}" cy="${y}" rx="12" ry="7" transform="rotate(${a} ${x} ${y})" fill="#C9786A" stroke="#A95A4D" stroke-width="1"/>`);

    s += herbs(16);
    s += `<path d="M72 30 a9 9 0 0 1 -6 14 z" fill="#A9D04F" stroke="#7DA93A" stroke-width="1"/>`;
  }
  return s + '</svg>';
}

          ${[64, 62, 60, 58].map((w) => `<line x1="34" x2="322" y1="${Y(w)}" y2="${Y(w)}" stroke="var(--line)" stroke-width="1"/><text x="0" y="${Y(w) + 4}" font-family="Barlow Condensed" font-weight="600" font-size="12" fill="var(--ink-3)">${w} kg</text>`).join('')}

      </section>
      <section class="card" data-n="Cân bằng nhóm cơ">
        <div class="row between"><h2 class="h3">Nhóm cơ tuần này</h2><span class="xs muted">số hiệp</span></div>

    let x = 0;
    const hypSvg = hyp.map(([l, m]) => { const w = m / tot * 350; const r = `<rect x="${x.toFixed(1)}" y="${lv[l].y}" width="${(w - 1.5).toFixed(1)}" height="20" rx="4" fill="${lv[l].c}"/>`; x += w; return r; }).join('');
    return `${sb()}
    <div class="body">
      <header class="row">${back('home')}<h1 class="h1 grow" style="font-size:26px">Sức khỏe</h1><button class="icon-btn" aria-label="Kết nối thiết bị">${ic('watch', 20)}</button></header>

          <path d="M ${pt(a0)} A ${R} ${R} 0 0 1 ${pt(a1)}" fill="none" stroke="var(--green)" stroke-width="16" stroke-linecap="round"/>
          <text x="110" y="98" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="64" fill="var(--on-hero)">${score}</text>
        </svg>
        <p class="h3">Sẵn sàng tập vừa sức</p>
        <p class="small muted" style="max-width:280px">Giữ nguyên buổi Thân dưới. Nếu chân còn mỏi, giảm Hip thrust xuống 3 hiệp.</p>
        <div class="factors" style="width:100%">${[['Giấc ngủ', 'Tốt', 'green'], ['Nhịp tim', 'Bình thường', 'green'], ['Cơ chân', 'Hơi mỏi', 'yellow']].map(([n, v, c]) => `<div style="text-align:left"><span class="xs muted">${n}</span><b style="color:var(--${c === 'green' ? 'on-hero' : 'on-hero'})"><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${C[c]};margin-right:6px;vertical-align:1px"></i>${v}</b></div>`).join('')}</div>
      </section>
      <section class="card" data-n="Giấc ngủ">
        <div class="row between" style="align-items:flex-start"><div><p class="lbl">Giấc ngủ đêm qua</p><p><span class="num" style="font-size:40px">7</span><span class="small muted">giờ </span><span class="num" style="font-size:40px">20</span><span class="small muted">phút</span></p></div><span class="tag green">Đủ giấc</span></div>
        <svg width="100%" viewBox="0 0 350 104" aria-label="Biểu đồ giai đoạn ngủ">${hypSvg}<text x="0" y="102" font-family="Barlow Condensed" font-weight="600" font-size="12" fill="var(--ink-3)">23:10</text><text x="175" y="102" text-anchor="middle" font-family="Barlow Condensed" font-weight="600" font-size="12" fill="var(--ink-3)">02:50</text><text x="350" y="102" text-anchor="end" font-family="Barlow Condensed" font-weight="600" font-size="12" fill="var(--ink-3)">06:30</text></svg>
        <div class="legend">${[['Sâu', 'blue', '1g 35p'], ['Nông', 'blue-2', '4g 05p'], ['REM', 'green', '1g 25p'], ['Thức', 'yellow', '15p']].map(([n, c, v]) => `<span><i style="background:var(--${c})"></i>${n} <b style="color:var(--ink);font-weight:600">${v}</b></span>`).join('')}</div>
      </section>
      <div class="grid2">
        <section class="tile" data-n="Nước">
          <div class="tile-h"><span class="ib" style="background:var(--blue-soft);color:var(--blue-ink)">${ic('droplets', 16)}</span>Nước</div>
          <span class="num">${vn(S.water * .25, 2).replace(/0$/, '')}<small>/ 2 lít</small></span>
          <div class="glasses">${Array.from({ length: 8 }, (_, i) => `<i class="${i < S.water ? 'on' : ''}"></i>`).join('')}</div>
          <button class="mini-btn" data-act="water" style="align-self:flex-start">${ic('plus', 14, 2.4)} 250 ml</button>
        </section>
        <section class="tile" data-n="Nhịp tim">
          <div class="tile-h"><span class="ib" style="background:var(--red-soft);color:var(--red-ink)">${ic('heart-pulse', 16)}</span>Nhịp tim nghỉ</div>
          <span class="num">64<small>bpm</small></span>
          <div style="display:flex;align-items:flex-end;gap:5px;height:44px;margin-top:auto">${[66, 65, 67, 64, 63, 65, 64].map((v, i) => `<i style="flex:1;height:${(v - 58) * 4.5}px;border-radius:3px;background:${i === 6 ? 'var(--red)' : 'var(--red-soft)'}"></i>`).join('')}</div>

      </div>

        <h2 class="h3">Hôm nay bạn thấy thế nào?</h2>
        <div class="chipset">${['Mệt', 'Bình thường', 'Khỏe', 'Rất khỏe'].map((t, i) => `<button class="choice ${S.mood === i ? 'on' : ''}" data-act="mood" data-v="${i}">${t}</button>`).join('')}</div>
      </section>
      <section class="list-card" data-n="Nhắc nhở & thiết bị">
        <div class="lrow"><span class="li">${ic('bell', 18)}</span><span class="grow col"><b style="font-weight:600">Nhắc uống nước</b><span class="xs muted">Mỗi 90 phút, 8:00–21:00</span></span><button class="toggle ${S.waterRemind ? 'on' : ''}" data-act="tg" data-v="waterRemind" role="switch" aria-checked="${S.waterRemind}" aria-label="Nhắc uống nước"><i></i></button></div>
        <div class="lrow"><span class="li">${ic('heart-pulse', 18)}</span><span class="grow col"><b style="font-weight:600">Apple Sức khỏe</b><span class="xs muted">Bước chân, nhịp tim, giấc ngủ</span></span><span class="tag green">Đã kết nối</span></div>
        <div class="lrow"><span class="li">${ic('activity', 18)}</span><span class="grow col"><b style="font-weight:600">Google Fit</b><span class="xs muted">Dành cho Android</span></span><button class="mini-btn" style="background:var(--surface-2);color:var(--ink)">Kết nối</button></div>

      </section>
    </div>
    ${homeInd()}`;
  },
});

// ---------- Điều khiển demo ----------
const app = document.getElementById('app');
let current = 'home';

function renderScreen(id) {
  const s = SCREENS.find((x) => x.id === id);
  const el = document.createElement('section');
  el.className = 'scr' + (s.cam ? ' cam' : '');
  el.id = 's-' + id;
  el.dataset.n = s.title;
  el.innerHTML = s.render();
  return el;
}
function hydrate(root) {
  root.querySelectorAll('svg[data-i]').forEach((el) => { el.outerHTML = ic(el.dataset.i, +el.getAttribute('width') || 20); });
}
function show(id, keepScroll) {
  if (id === 'guide') return showGuide();
  if (!SCREENS.some((s) => s.id === id)) id = 'home';
  document.getElementById('d-guide').hidden = true;
  document.getElementById('d-phone-wrap').hidden = false;
  const old = app.querySelector('.scr');
  const top = keepScroll && old ? old.scrollTop : 0;
  app.querySelectorAll('.scr').forEach((n) => n.remove());
  const el = renderScreen(id);
  app.prepend(el);
  el.scrollTop = top;
  current = id;
  markList();
  notes();
  try { history.replaceState(null, '', '#' + id); } catch (e) { /* khung xem có thể chặn */ }
}
function showGuide() {
  current = 'guide';
  document.getElementById('d-phone-wrap').hidden = true;
  const g = document.getElementById('d-guide');
  g.hidden = false;
  g.innerHTML = guide();
  markList();
  notes();
  try { history.replaceState(null, '', '#guide'); } catch (e) { /* bỏ qua */ }
}
const rerender = () => current === 'guide' ? showGuide() : show(current, true);

function list(targetId) {
  const groups = [...new Set(SCREENS.map((s) => s.group))];
  document.getElementById(targetId).innerHTML = groups.map((g) => `<div class="d-group" style="margin-bottom:14px"><h3>${g}</h3>${SCREENS.filter((s) => s.group === g).map((s) =>
    `<button data-screen="${s.id}"><i class="d-dot" style="background:${C[s.dot]}"></i>${s.title}${s.isNew ? '<span class="d-new">Mới</span>' : ''}</button>`).join('')}</div>`).join('') +
    `<div class="d-group"><h3>Tham chiếu</h3><button data-screen="guide"><i class="d-dot" style="background:var(--shell-ink)"></i>Hệ thống thiết kế</button></div>`;
}
function markList() {
  document.querySelectorAll('[data-screen]').forEach((b) => b.classList.toggle('on', b.dataset.screen === current));
  const s = SCREENS.find((x) => x.id === current);
  document.getElementById('d-mobile-name').textContent = s ? s.title : 'Hệ thống thiết kế';
}
function notes() {
  const i = SCREENS.findIndex((x) => x.id === current);
  const s = SCREENS[i];
  const box = document.getElementById('d-notes');
  if (!s) { box.innerHTML = `<p class="d-kicker">Tham chiếu</p><h2>Hệ thống thiết kế</h2><p>Màu, chữ, thành phần và biểu tượng dùng trong mọi màn. Bản SVG của trang này nằm cùng thư mục với các màn hình.</p>`; return; }
  const prev = SCREENS[(i - 1 + SCREENS.length) % SCREENS.length], next = SCREENS[(i + 1) % SCREENS.length];
  box.innerHTML = `<p class="d-kicker">${s.group} · ${i + 1}/${SCREENS.length}</p><h2>${s.title}</h2><p>${s.note}</p>
    <div class="d-card"><p class="d-kicker">Điểm chính</p><ul>${s.points.map((p) => `<li>${p}</li>`).join('')}</ul></div>
    ${s.newPoints ? `<div class="d-card"><p class="d-kicker">Chưa có trong app hiện tại</p><ul>${s.newPoints.map((p) => `<li class="new">${p}</li>`).join('')}</ul></div>` : ''}
    <div class="d-pager"><button data-screen="${prev.id}">${ic('arrow-left', 16)} ${prev.title}</button><button data-screen="${next.id}">${next.title} ${ic('arrow-right', 16)}</button></div>`;
}

// Lớp phủ trong máy: chọn chức năng camera, thông báo nhỏ
function sheet() {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="ov-sheet"><i class="handle" style="margin-bottom:6px"></i><p class="h3" style="padding:0 4px 4px">Dùng camera để</p>
    ${[['utensils', 'green', 'Chụp món ăn', 'Biết calo và lời khuyên cho bữa này', 'scan'], ['camera', 'blue', 'Chỉnh dáng khi tập', 'Đếm lần và sửa tư thế squat, lunge, plank', 'coach'], ['scale', 'yellow', 'Ghi cân nặng', 'Chụp màn hình cân hoặc nhập tay', 'progress']].map(([i, c, t, d, go]) => `<button class="ov-item" data-go="${go}"><span class="ch-ic" style="background:var(--${c}-soft);color:var(--${c}-ink);width:46px;height:46px">${ic(i, 22)}</span><span class="grow col"><b style="font-weight:600">${t}</b><span class="xs muted">${d}</span></span>${ic('chevron-right', 18)}</button>`).join('')}
    <button class="btn ghost" data-act="close">Đóng</button></div>`;
  ov.addEventListener('click', (e) => { if (e.target === ov) ov.remove(); });
  app.append(ov);
}
let toastTimer;
function toast(msg) {
  let t = app.querySelector('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; app.append(t); }
  t.innerHTML = `${ic('circle-check', 18)}<span>${msg}</span>`;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.hidden = true), 2200);
}
function setTheme(v) {
  if (v === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = v;
  try { localStorage.setItem('fc-theme', v); } catch (e) { /* bỏ qua */ }
  document.querySelectorAll('[data-theme-set]').forEach((b) => b.classList.toggle('on', b.dataset.themeSet === v));
  rerender();
}

document.addEventListener('click', (e) => {
  const scr = e.target.closest('[data-screen]');
  if (scr) { show(scr.dataset.screen); document.getElementById('d-sheet').hidden = true; return; }
  const th = e.target.closest('[data-theme-set]');
  if (th) return setTheme(th.dataset.themeSet);
  const a = e.target.closest('[data-act]');
  if (a && app.contains(a)) {
    const v = a.dataset.v;
    switch (a.dataset.act) {
      case 'water': S.water = Math.min(8, S.water + 1); rerender(); toast(`Đã ghi 250 ml, tổng ${vn(S.water * .25, 2).replace(/0$/, '')} lít`); break;
      case 'glass': S.water = +v < S.water ? +v : +v + 1; rerender(); break;
      case 'toggle': { const id = a.dataset.id; S.done.has(id) ? S.done.delete(id) : S.done.add(id); rerender(); break; }
      case 'add': S.added.add(a.dataset.id); if (a.dataset.then) { show(a.dataset.then); } else rerender(); toast(`Đã thêm ${DISHES[a.dataset.id].name} vào bữa tối`); break;
      case 'goal': S.goal = v; rerender(); break;
      case 'target': S.target = Math.max(45, Math.min(61, S.target + +v)); rerender(); break;
      case 'mood': S.mood = +v; rerender(); break;
      case 'rpe': S.rpe = +v; rerender(); break;
      case 'portion': S.portion = +v; rerender(); break;
      case 'tg': S[v] = !S[v]; rerender(); break;
      case 'theme': setTheme(v); break;
      case 'set': S.set = S.set >= 4 ? 1 : S.set + 1; S.reps = 0; rerender(); toast(`Nghỉ 75 giây rồi vào hiệp ${S.set}`); break;
      case 'sheet': sheet(); break;
      case 'close': a.closest('.overlay').remove(); break;
      case 'join': a.textContent = 'Đã tham gia'; a.style.background = 'var(--green)'; break;
      case 'toast': if (a.dataset.then) show(a.dataset.then); toast(v); break;
    }
    return;
  }
  const go = e.target.closest('[data-go]');
  if (go && app.contains(go)) show(go.dataset.go);
});
document.getElementById('d-mobile-open').addEventListener('click', () => (document.getElementById('d-sheet').hidden = false));
document.getElementById('d-sheet-close').addEventListener('click', () => (document.getElementById('d-sheet').hidden = true));
document.getElementById('d-sheet').addEventListener('click', (e) => { if (e.target.id === 'd-sheet') e.target.hidden = true; });

// Thu nhỏ điện thoại cho vừa chiều cao cửa sổ
function fit() {
  const ph = document.getElementById('d-phone');
  if (innerWidth <= 760) { ph.style.transform = ''; ph.parentElement.style.height = ''; return; }
  const k = Math.min(1, (innerHeight - 48) / 866);
  ph.style.transform = `scale(${k})`;
  ph.parentElement.style.height = 866 * k + 'px';
  ph.parentElement.style.width = 412 * k + 'px';
  ph.style.transformOrigin = 'top left';
}
addEventListener('resize', fit);
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== current) show(h); });

// Bộ đếm sống động trên màn đang tập và camera
setInterval(() => {
  if (current === 'session') {
    const r = document.getElementById('rep'), c = document.getElementById('clock');
    if (S.reps < 12) S.reps++;
    if (r) { r.textContent = String(S.reps).padStart(2, '0'); r.classList.remove('pop'); void r.offsetWidth; r.classList.add('pop'); }
    if (c) { const t = 32 + S.reps * 3; c.textContent = `00:${String(t % 60).padStart(2, '0')}`.replace('00:', t >= 60 ? '01:' : '00:'); }
  }
  if (current === 'coach') {
    S.coachReps = S.coachReps >= 15 ? 1 : S.coachReps + 1;
    const r = document.getElementById('coach-rep');
    if (r) r.textContent = String(S.coachReps).padStart(2, '0');
  }
}, 2400);

if (EXPORT) {
  document.documentElement.classList.add('exp');
  document.body.classList.add('exp');
  const t = new URLSearchParams(location.search).get('theme');
  if (t) document.documentElement.dataset.theme = t;
  const box = document.getElementById('export');
  SCREENS.forEach((s) => box.append(renderScreen(s.id)));
  const g = document.createElement('div');
  g.className = 'd-guide';
  g.id = 's-guide';
  g.innerHTML = guide();
  box.append(g);
} else {
  let saved = null;
  try { saved = localStorage.getItem('fc-theme'); } catch (e) { /* bỏ qua */ }
  if (saved && saved !== 'auto') document.documentElement.dataset.theme = saved;
  document.querySelectorAll('[data-theme-set]').forEach((b) => b.classList.toggle('on', b.dataset.themeSet === (saved || 'auto')));
  list('d-list');
  list('d-list-m');
  hydrate(document.body);
  show(location.hash.slice(1) || 'home');
  fit();
}
</script>
